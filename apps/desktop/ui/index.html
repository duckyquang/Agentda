<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agentda</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #16181c; --panel: #1d2025; --line: #2b2f36; --ink: #e8eaed; --dim: #9aa1ab;
    --accent: #6ea8fe; --ok: #57c98a; --no: #e2726e; --auto: #d9a441;
  }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: grid; grid-template-columns: 280px 1fr;
    background: var(--bg); color: var(--ink); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  aside { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .brand { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; }
  .brand b { font-size: 18px; letter-spacing: -.01em; }
  .bots { overflow-y: auto; flex: 1; }
  .bot { padding: 12px 16px; border-bottom: 1px solid var(--line); cursor: pointer; display: flex; gap: 10px; align-items: flex-start; }
  .bot:hover { background: #23262c; }
  .bot[aria-selected="true"] { background: #262b33; box-shadow: inset 3px 0 0 var(--accent); }
  .dot { width: 26px; height: 26px; border-radius: 50%; background: #3a4048; flex: none;
    display: grid; place-items: center; font-size: 12px; font-weight: 600; }
  .bot .meta { min-width: 0; flex: 1; }
  .bot .row { display: flex; justify-content: space-between; gap: 8px; }
  .bot .name { font-weight: 600; }
  .bot .last { color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tag { font-size: 11px; letter-spacing: .04em; padding: 1px 6px; border-radius: 999px; border: 1px solid var(--line); color: var(--dim); }
  .tag.auto { color: var(--auto); border-color: #4a3f26; }
  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  header { padding: 12px 18px; font-size: 18px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; }
  header .grow { flex: 1; }
  header button, header .tag { font-size: 14px; }
  button { font: inherit; color: var(--ink); background: #2a2f37; border: 1px solid var(--line);
    padding: 6px 12px; border-radius: 8px; cursor: pointer; }
  button:hover { background: #333944; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #10131a; font-weight: 600; }
  button.danger { background: transparent; border-color: #59403f; color: var(--no); }
  #thread { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 68ch; padding: 10px 14px; border-radius: 12px; background: var(--panel); white-space: pre-wrap; word-wrap: break-word; }
  .msg.me { align-self: flex-end; background: #2f4468; }
  .msg.sys { align-self: center; background: transparent; color: var(--dim); font-size: 12px; }
  .card { border: 1px solid #4a3f26; background: #221f18; border-radius: 12px; padding: 12px 14px; max-width: 68ch; }
  .card h4 { margin: 0 0 6px; font-size: 14px; }
  .card pre { margin: 8px 0; padding: 8px; background: #14161a; border-radius: 8px; overflow-x: auto; font-size: 12px; }
  .card .actions { display: flex; gap: 8px; margin-top: 8px; }
  form { display: flex; gap: 8px; padding: 14px 18px; border-top: 1px solid var(--line); }
  input[type=text] { flex: 1; background: #14161a; color: var(--ink); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 14px; font: inherit; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); }
  th { color: var(--dim); font-weight: 500; }
  td.deny { color: var(--no); } td.allow { color: var(--ok); }
  .empty { color: var(--dim); padding: 24px; text-align: center; }
</style>
</head>
<body>
<aside>
  <div class="brand"><b>Agentda</b><button id="pause">Pause</button></div>
  <div class="bots" id="bots"></div>
</aside>
<main>
  <header>
    <strong id="title">—</strong>
    <span class="tag" id="mode"></span>
    <span class="grow"></span>
    <button id="tab-chat">Chat</button>
    <button id="tab-audit">Audit</button>
  </header>
  <div id="thread"><div class="empty">Pick a bot.</div></div>
  <form id="composer"><input type="text" id="text" placeholder="Message your bot…" autocomplete="off" /><button class="primary">Send</button></form>
</main>
<script>
const TOKEN = new URLSearchParams(location.search).get('token') || '__AGENTDA_TOKEN__'
const api = (path, opts = {}) =>
  fetch(path, { ...opts, headers: { 'content-type': 'application/json', authorization: `Bearer ${TOKEN}`, ...(opts.headers || {}) } })
    .then((r) => r.json())

let state = { bots: [], pending: [], paused: false }
let current = null
let view = 'chat'
const threads = new Map() // botId -> [{who, text}]

const el = (id) => document.getElementById(id)
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c])

function renderBots() {
  el('bots').innerHTML = state.bots.map((b) => {
    const last = (threads.get(b.id) || []).at(-1)
    const waiting = state.pending.some((p) => p.bot === b.id)
    return `<div class="bot" data-id="${b.id}" aria-selected="${current === b.id}">
      <div class="dot">${esc(b.name.slice(0, 1).toUpperCase())}</div>
      <div class="meta">
        <div class="row"><span class="name">${esc(b.name)}</span>
          <span class="tag ${b.mode === 'auto' ? 'auto' : ''}">${b.mode.toUpperCase()}</span></div>
        <div class="last">${waiting ? '● needs you' : esc(last ? last.text.slice(0, 60) : b.provider)}</div>
      </div></div>`
  }).join('') || '<div class="empty">No bots configured.</div>'
  for (const node of document.querySelectorAll('.bot')) {
    node.onclick = () => { current = node.dataset.id; view = 'chat'; render() }
  }
}

function renderThread() {
  const bot = state.bots.find((b) => b.id === current)
  el('title').textContent = bot ? bot.name : '—'
  el('mode').textContent = bot ? (state.paused ? 'PAUSED' : bot.mode.toUpperCase()) : ''
  el('composer').style.display = bot && view === 'chat' ? 'flex' : 'none'
  if (!bot) return void (el('thread').innerHTML = '<div class="empty">Pick a bot.</div>')

  if (view === 'audit') return renderAudit(bot)

  const msgs = (threads.get(bot.id) || []).map((m) =>
    `<div class="msg ${m.who === 'me' ? 'me' : m.who === 'sys' ? 'sys' : ''}">${esc(m.text)}</div>`).join('')
  const cards = state.pending.filter((p) => p.bot === bot.id).map((p) =>
    `<div class="card"><h4>${esc(bot.name)} wants to run <code>${esc(p.tool)}</code></h4>
      <div style="color:var(--dim);font-size:12px">${esc(p.reason || '')}</div>
      <pre>${esc(JSON.stringify(p.input, null, 2)).slice(0, 2000)}</pre>
      <div class="actions">
        <button class="primary" data-approve="${p.id}">Approve</button>
        <button class="danger" data-deny="${p.id}">Deny</button>
      </div></div>`).join('')
  el('thread').innerHTML = msgs + cards || '<div class="empty">No messages yet.</div>'
  el('thread').scrollTop = el('thread').scrollHeight
  for (const b of document.querySelectorAll('[data-approve]')) {
    b.onclick = () => decide(b.dataset.approve, 'allow')
  }
  for (const b of document.querySelectorAll('[data-deny]')) {
    b.onclick = () => decide(b.dataset.deny, 'deny')
  }
}

async function renderAudit(bot) {
  const { rows } = await api(`/api/audit?limit=200&bot=${encodeURIComponent(bot.id)}`)
  el('thread').innerHTML = rows.length
    ? `<table><tr><th>when</th><th>tool</th><th>decision</th><th>why</th><th>mode</th></tr>` +
      rows.map((r) => `<tr><td>${esc(r.ts)}</td><td>${esc(r.tool)}</td>
        <td class="${r.decision}">${esc(r.decision)}</td><td>${esc(r.source)}</td><td>${esc(r.mode)}</td></tr>`).join('') +
      `</table>`
    : '<div class="empty">Nothing audited yet.</div>'
}

async function decide(id, decision) {
  const r = await api('/api/approve', { method: 'POST', body: JSON.stringify({ id, decision }) })
  state.pending = state.pending.filter((p) => p.id !== id)
  // A request that already timed out cannot be approved after the fact; saying
  // otherwise would tell the user the opposite of what happened.
  push(current, 'sys', r.settled
    ? `you ${decision === 'allow' ? 'approved' : 'denied'} it`
    : 'too late — that request had already expired (denied)')
  render()
}

function push(botId, who, text) {
  if (!botId) return
  const t = threads.get(botId) || []
  t.push({ who, text })
  threads.set(botId, t)
}

function render() { renderBots(); renderThread() }

async function refresh() {
  state = await api('/api/state')
  render()
}

el('composer').onsubmit = async (e) => {
  e.preventDefault()
  const text = el('text').value.trim()
  if (!text || !current) return
  el('text').value = ''
  push(current, 'me', text)
  render()
  // The reply arrives on the event stream: a turn can pause on an approval for
  // as long as you take to answer it.
  await api('/api/send', { method: 'POST', body: JSON.stringify({ bot: current, text }) })
}

el('pause').onclick = async () => {
  const r = await api('/api/pause', { method: 'POST', body: JSON.stringify({ on: !state.paused }) })
  state.paused = r.paused
  el('pause').textContent = state.paused ? 'Resume' : 'Pause'
  render()
}
el('tab-chat').onclick = () => { view = 'chat'; render() }
el('tab-audit').onclick = () => { view = 'audit'; render() }

// Live updates: approvals arriving while you watch, without polling.
const es = new EventSource(`/api/events?token=${TOKEN}`)
es.addEventListener('approval', (e) => { state.pending.push(JSON.parse(e.data)); render() })
es.addEventListener('resolved', (e) => {
  const { id } = JSON.parse(e.data)
  state.pending = state.pending.filter((p) => p.id !== id)
  render()
})
es.addEventListener('message-out', (e) => { const d = JSON.parse(e.data); push(d.bot, 'bot', d.text); render() })

refresh()
setInterval(refresh, 15000) // catches anything the stream missed
</script>
</body>
</html>
