id = "scout"
name = "Research Scout"
provider = "claude"
mode = "ask"

# Browsing is off by default: Playwright is a ~150MB install. Flip it on and
# this bot gets hands (shadow surface, so it never takes your screen).
browser = false
browser_surface = "shadow"

auto_approve = [
  "mcp__agentda__memory_read",
  "mcp__browser__browser_navigate",
  "mcp__browser__browser_read",
  "mcp__browser__browser_screenshot",
]

# Clicking and typing can submit, buy, or post — always a human decision.
always_ask = ["Bash", "shell", "mcp__*__shell*", "mcp__*__exec*", "mcp__browser__browser_click", "mcp__browser__browser_type"]

daily_turn_cap = 40
